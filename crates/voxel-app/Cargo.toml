[package]
name = "voxel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wgpu + winit front end for the voxel world-gen POC."

[dependencies]
voxel-core.workspace = true

anyhow.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
log.workspace = true
pollster.workspace = true
rayon.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
# Test-only: parses the inline WGSL so shader typos fail at test time rather
# than when a real device is created. Must match the version wgpu resolves.
naga = { version = "27", features = ["wgsl-in"] }
